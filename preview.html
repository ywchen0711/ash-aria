<!doctype html><meta charset="utf-8"><title>Ash Aria · 魔物美術預覽</title><body style="margin:0;background:#2a2018;color:#e8dcc8;font:14px sans-serif"><p style="padding:8px 8px 0">霜石礦坑的魔物：上排舊版，下排新版（實際戰鬥大小 ×3）</p>
<div id="g" style="padding:8px"></div>
<script type="module">
import { MONSTERS } from './js/monsters.js?v=4';
import { monster } from './js/art.js?v=4';
const z = 3, pairs = [['minerat', 'rat'], ['frostbat', 'bat'], ['slimeice', 'slime'], ['guard', 'soldier'], ['captain', 'knight'], ['ironshell', 'crab']];
for (const [label, useOld] of [['舊 Old', true], ['新 New', false]]) {
  const row = document.createElement('div'); row.style.cssText = 'display:flex;gap:10px;align-items:flex-end;margin-bottom:10px';
  const t = document.createElement('div'); t.textContent = label; t.style.width = '60px'; row.appendChild(t);
  for (const [id, old] of pairs) {
    const m = MONSTERS[id], N = Math.round(Math.min(96, 46 * (m.size || 1)));
    const c = monster(useOld ? old : m.art, m.col, false, N), d = document.createElement('div'); d.style.textAlign = 'center';
    const cv = document.createElement('canvas'); cv.width = N * z; cv.height = N * z; const g = cv.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(c, 0, 0, N * z, N * z);
    d.appendChild(cv); d.appendChild(document.createElement('br')); d.append(m.name[1]); row.appendChild(d);
  }
  document.getElementById('g').appendChild(row);
}
</script>
