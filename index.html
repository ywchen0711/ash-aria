<title>灰燼詠嘆調 · Ash Aria</title>
<meta name="description" content="一個關於歌與沉默的原創 JRPG：十五位各有專屬指令的同伴、ATB 戰鬥、星晶魔法，和一位想讓世界安靜睡去的溫柔指揮者。 An original JRPG about song and silence: fifteen companions, ATB battles, Astral magic, and a gentle conductor who wants the world to sleep.">

<body>
<div id="wrap"><div id="screen"><canvas id="gl"></canvas><canvas id="game"></canvas><div id="loading">灰燼詠嘆調 · ASH ARIA<br><small>載入中… Loading…</small></div></div></div>
<div id="pad">
  <div class="dpad"><button data-k="up">▲</button><button data-k="left">◀</button><button data-k="right">▶</button><button data-k="down">▼</button></div>
  <div class="ab"><button data-k="back" class="b">B</button><button data-k="ok" class="a">A</button></div>
</div>
<div id="help">← ↑ ↓ → / WASD：移動 Move · Z / Space / Enter：確定・對話 OK · X / Esc：選單・取消 Menu · M：音樂 Music</div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script>
  // if the game hasn't started within a few seconds (an old cached file, or a slow network), say what to do
  addEventListener('error', function () { var t = document.getElementById('loading'); if (t && !window.__aa) t.innerHTML = '載入失敗，請按 Ctrl+F5（手機請重新整理）<br><small>Loading failed: press Ctrl+F5 (or reload on a phone)</small>'; }, true);
  setTimeout(function () { var t = document.getElementById('loading'); if (!window.__aa && t) t.innerHTML = '還在載入……如果一直停在這裡，請按 Ctrl+F5<br><small>Still loading… if it stays here, press Ctrl+F5</small>'; }, 9000);
  var iv = setInterval(function () { if (window.__aa) { var t = document.getElementById('loading'); if (t) t.remove(); clearInterval(iv); } }, 200);
</script>
<script type="module" src="js/game.js?v=6"></script>
<script src="/hub.js" data-pos="top-left" defer></script>
